name: "CI tests"

on:
    push:
    pull_request:
    workflow_dispatch:

env:
    RUST_BACKTRACE: 1

jobs:

    test:
        name: Run tests
        runs-on: ubuntu-latest

        steps:
        -   uses: actions/checkout@v7

        # Native build tools for vendored libavif/dav1d (see flake.nix devShell).
        -   name: Install native build tools
            run: |
                sudo apt-get update -y
                sudo apt-get install -y cmake nasm meson ninja-build perl clang pkg-config

        -   name: Install Rust
            run: |
                rustup toolchain install stable
                rustup default stable

        -   uses: Swatinem/rust-cache@v2

        -   name: Run tests
            run: |
                cargo test --all-features
