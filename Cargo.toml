[package]
name = "cryslen"
version = "0.1.0"
edition = "2021"
description = "minimal wayland image viewer with manga mode"

[[bin]]
name = "cy"
path = "src/main.rs"

[dependencies]
bytemuck = "1"
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["wayland"] }
egui_glow = { version = "0.37", default-features = false, features = ["winit", "wayland"] }
# System font fallback for non-Latin filenames
egui_system_font_provider = "0.37"
glow = "0.17"
glutin = { version = "0.32", default-features = false, features = ["egl", "wayland"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "wayland"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }

eros = { version = "0.8", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
natord = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["bzip2"] }
# AVIF via libavif + dav1d (built from source; needs the flake devShell toolchain)
libavif-sys = { version = "0.17", default-features = false, features = ["codec-dav1d"] }
# JPEG XL via jxl-rs (pure Rust)
jxl = "0.7"

[profile.release]
lto = "thin"

#
# Lints
#

# This serves dual purposes as both lint config and reminder for
# when to use what lints.
[lints.clippy]

# Broad groups: lowest priority
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -2 }
restriction = { level = "warn", priority = -2 }
# cargo = { level = "warn", priority = -2 }

# Override part of `all`
correctness = { level = "deny", priority = -1 }

# Suppress Clippy's warning about enabling all restriction lints.
blanket_clippy_restriction_lints = "allow"

# Too annoying!
cognitive_complexity = "allow"
missing_const_for_fn = "allow" # has bug
too_many_lines = "allow"
missing_errors_doc = "allow"

# Noah allows
struct_excessive_bools = "allow"

# Allow quite few lints from correctness group, these can be useful
# in some specific cases but generally they are dumb.
implicit_return = "allow"
default_numeric_fallback = "allow"
question_mark_used = "allow"
print_stderr = "allow"
print_stdout = "allow"
arbitrary_source_item_ordering = "allow"
missing_docs_in_private_items = "allow"
missing_inline_in_public_items = "allow"
missing_trait_methods = "allow"
single_call_fn = "allow"
non_ascii_literal = "allow"
inline_modules = "allow"
integer_division_remainder_used = "allow"
as_conversions = "allow"
mod_module_files = "allow"

# Shadow is useful, clippy's lints on shadow_same and shadow_reuse
# are unreasonable, though shadow_unrelated can be useful.
shadow_same = "allow"
shadow_reuse = "allow"
shadow_unrelated = "warn"

# Useful when writting no_std codes, but annoying in general codes.
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"

# I prefer 1_u64 style
separated_literal_suffix = "allow"

# Useful in embedded environments, but annoying in general codes.
float_arithmetic = "allow"

# I prefer semicolon inside block style,
# i.e.
# {
#     f();
# }
semicolon_outside_block = "allow"

# I like it
impl_trait_in_params = "allow"

# Too annoying for normal Rust apps, seletively enable for specific module,
# see tomato.rs for an example.
arithmetic_side_effects = "allow"

# Prefer match ergonomics or explicit ownership like as_ref().
pattern_type_mismatch = "allow"

# I prefer pub(crate) shorthand
pub_with_shorthand = "allow"
